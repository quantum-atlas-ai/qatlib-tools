name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: '3.12'

jobs:
  test:
    if: ${{ !github.event.repository.private || github.repository == 'quantum-atlas-ai/qatlib-tools-staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check human-reviewed contracts
        env:
          CONTRACT_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '--draft' || '' }}
        run: uv run --locked python scripts/check_human_contracts.py $CONTRACT_DRAFT
      - name: Verify lockfile
        run: uv lock --check
      - name: Build distributions
        run: uv build --no-build-isolation --python .venv/bin/python
      - name: Run tests
        run: uv run --no-sync python -m pytest -q -rs
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.12 .wheel-venv-ci
          uv pip install --python .wheel-venv-ci/bin/python dist/*.whl
          .wheel-venv-ci/bin/qatlib-env --help
          .wheel-venv-ci/bin/qatlib-env exec --help
          .wheel-venv-ci/bin/qatlib-env promotion merge-bibliography --help
          .wheel-venv-ci/bin/qatlib-env docs > .wheel-venv-ci/manual.md
          cmp README.md .wheel-venv-ci/manual.md
          .wheel-venv-ci/bin/qatlib-forge --help
          .wheel-venv-ci/bin/qatlib-retrieve --help
          .wheel-venv-ci/bin/qatlib-lean-tools retrieve --help
          .wheel-venv-ci/bin/qatlib-lean-tools env --help
          .wheel-venv-ci/bin/python -m qatlib_search --help
          .wheel-venv-ci/bin/python -m qatlib_env.ci --help
          version=$(uv run --no-sync cz version --project)
          for cli in qatlib-env qatlib-forge qatlib-retrieve qatlib-lean-tools; do
            test "$(".wheel-venv-ci/bin/$cli" --version)" = "$cli $version"
          done
      - name: Hash verified distributions
        if: github.ref_type == 'tag'
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  release:
    if: ${{ !github.event.repository.private && github.repository == 'quantum-atlas-ai/qatlib-tools' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: test
    runs-on: ubuntu-latest
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify release tag and extract notes
        id: meta
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          uv run --locked python scripts/release_metadata.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
