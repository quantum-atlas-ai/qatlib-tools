name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish from main (optional)
        type: string

permissions:
  contents: read

env:
  UV_PYTHON: '3.12'

jobs:
  test:
    runs-on: ${{ fromJSON(vars.QATLIB_TOOLS_TEST_RUNNERS || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    outputs:
      release_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false
      - name: Record release commit
        if: github.ref_type == 'tag' || inputs.release_tag
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: runner.environment == 'github-hosted'
        with:
          enable-cache: true
      - name: Verify the runner's uv installation
        run: uv --version
      - name: Check human-reviewed contracts
        env:
          CONTRACT_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '--draft' || '' }}
        run: uv run --locked python scripts/check_human_contracts.py $CONTRACT_DRAFT
      - name: Verify lockfile
        run: uv lock --check
      - name: Build distributions
        run: uv build --no-build-isolation --python .venv/bin/python
      - name: Run tests
        run: uv run --no-sync python -m pytest -q -rs
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.12 .wheel-venv-ci
          uv pip install --python .wheel-venv-ci/bin/python dist/*.whl
          .wheel-venv-ci/bin/qatlib-env --help
          .wheel-venv-ci/bin/qatlib-env exec --help
          .wheel-venv-ci/bin/qatlib-env promotion merge-bibliography --help
          .wheel-venv-ci/bin/qatlib-env docs > .wheel-venv-ci/manual.md
          cmp README.md .wheel-venv-ci/manual.md
          .wheel-venv-ci/bin/qatlib-forge --help
          .wheel-venv-ci/bin/qatlib-retrieve --help
          .wheel-venv-ci/bin/qatlib-lean-tools retrieve --help
          .wheel-venv-ci/bin/qatlib-lean-tools env --help
          .wheel-venv-ci/bin/python -m qatlib_search --help
          .wheel-venv-ci/bin/python -m qatlib_env.ci --help
          version=$(uv run --no-sync cz version --project)
          for cli in qatlib-env qatlib-forge qatlib-retrieve qatlib-lean-tools; do
            test "$(".wheel-venv-ci/bin/$cli" --version)" = "$cli $version"
          done
      - name: Hash verified distributions
        if: github.ref_type == 'tag' || inputs.release_tag
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || inputs.release_tag
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  release:
    if: >-
      ${{ !github.event.repository.private && github.repository == 'quantum-atlas-ai/qatlib-tools'
          && startsWith(inputs.release_tag || github.ref_name, 'v')
          && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch'
              && github.ref == 'refs/heads/main' && inputs.release_tag)) }}
    needs: test
    runs-on: ubuntu-latest
    concurrency: release-${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass the tag explicitly so checkout preserves the annotated Git object.
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify release tag and extract notes
        id: meta
        env:
          TESTED_COMMIT: ${{ needs.test.outputs.release_commit }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{commit}")" = "$TESTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = "$TESTED_COMMIT"
          fi
          git merge-base --is-ancestor HEAD origin/main
          uv run --locked python scripts/release_metadata.py --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
