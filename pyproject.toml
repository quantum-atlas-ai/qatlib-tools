[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qatlib-tools"
version = "0.1.0"
description = "Shared Lean workspace, Forge, and search tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qatlib-env = "qatlib_env.__main__:main"
qatlib-forge = "qatlib_forge.__main__:main"
qatlib-search = "qatlib_search.__main__:main"

[project.optional-dependencies]
validation = ["jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/qatlib_env", "src/qatlib_forge", "src/qatlib_search"]

[tool.setuptools.package-data]
qatlib_env = ["docs/*.md", "setup_runner.sh"]
qatlib_search = ["*.lean", "*.json", "README.md"]

[tool.qatlib-env]
source_roots = ["."]
cache_dir = ".lake"
local_pool_mib = 24576
local_pool_cpu = 4
default_jobs = 2
default_memory_mib = 2048
cloud_platform = "auto"

